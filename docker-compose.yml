services:
  nginx-rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: video-nginx-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - hls-data:/tmp/hls

  ffmpeg:
    image: linuxserver/ffmpeg:latest
    container_name: video-ffmpeg
    restart: unless-stopped
    command: ["sleep", "infinity"]
    volumes:
      - ./media:/media
    depends_on:
      - nginx-rtmp

  redis:
    image: redis:7-alpine
    container_name: video-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16
    container_name: video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: video_platform
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: video-backend
    restart: unless-stopped
    command: sh -c "sh /app/docker/backend/entrypoint.sh"
    environment:
      DB_ENGINE: postgres
      DB_NAME: video_platform
      DB_USER: video
      DB_PASSWORD: video123456
      DB_HOST: postgres
      DB_PORT: 5432
      RTMP_SERVER_URL: rtmp://nginx-rtmp:1935
      HLS_SERVER_URL: http://nginx-rtmp:8080
    volumes:
      - .:/app
    ports:
      - "8008:8000"
    depends_on:
      - postgres
      - redis
      - nginx-rtmp

  frontend:
    image: node:20-alpine
    container_name: video-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  hls-data:
  redis-data:
  postgres-data:
